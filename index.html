<!DOCTYPE html>
<html>
    <head>
        <title>
            ASCII Dungeon Generator
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <pre id="dungeon"></pre>
        <script>
            // starting dimensions
            let map_height = 60;
            let map_width = 100;

            let room_height = 5;
            let room_width = 11;

            let frame = 5; // map gen padding
            let minimum_room_row = frame + Math.floor(room_height / 2);
            let maximum_room_row = map_height - 1 - frame - Math.floor(room_height / 2);

            let minimum_room_column = frame + Math.floor(room_width / 2);
            let maximum_room_column = map_width - 1 - frame - Math.floor(room_width / 2);
            
            let range_y = maximum_room_row - minimum_room_row + 1;
            let range_x = maximum_room_column - minimum_room_column + 1;

            let random_room_row = Math.floor(Math.random() * range_y) + minimum_room_row;
            let random_room_column = Math.floor(Math.random() * range_x) + minimum_room_column;

            
            console.log("Random room row:", random_room_row);
            console.log("Random room column:", random_room_column);
            
            let dungeon = [];
            //outer loop
            for (let h_index = 0; h_index < map_height; h_index++) {
                let row = [];
                //inner loop
                for (let w_index = 0; w_index < map_width; w_index++) {
                    row.push("#");
                }
                dungeon.push(row);
            }        
            // Display
            for (let row = 0; row < dungeon.length; row++) {
                //console.log(dungeon[row].join(""));
                document.getElementById("dungeon").textContent += dungeon[row].join("") + "\n";
            }
            console.log("Dungeon dimensions:", dungeon.length, dungeon[0].length);
        </script>
    </body>
</html>
