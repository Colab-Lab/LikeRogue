<!DOCTYPE html>
<html>
    <head>
        <title>
            ASCII Dungeon Generator
        </title>
    </head>
    <body>
        <pre id="dungeon"></pre>
        <script>
            // Construct
            let map_height = 30;
            let map_width = 100;

            let height = 10;
            let width = 60;

            let dungeon = [];
            //outer loop
            for (let h_index = 0; h_index < height; h_index++) {
                let row = [];
                //inner loop
                for (let w_index = 0; w_index < width; w_index++) {
                    row.push("#");
                }
                dungeon.push(row);
            }        

            // Display
            for (let row = 0; row < dungeon.length; row++) {
                //console.log(dungeon[row].join(""));
                document.getElementById("dungeon").textContent += dungeon[row].join("") + "\n";
            }
     
        </script>
    </body>
</html>
